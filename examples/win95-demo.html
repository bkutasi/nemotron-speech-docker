<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemotron ASR - Win95 Demo</title>
<style>
*{box-sizing:border-box}
body{background:#008080;font-family:"MS Sans Serif",Tahoma,Geneva,sans-serif;font-size:12px;margin:0;padding:24px;min-height:100vh;color:#000}
.win{background:#c0c0c0;border:2px solid;border-color:#dfdfdf #404040 #404040 #dfdfdf;box-shadow:2px 2px 0 #000;max-width:620px;margin:0 auto;padding:2px}
.titlebar{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 4px;display:flex;align-items:center;gap:6px;font-size:13px}
.titlebar .t{flex:1;white-space:nowrap;overflow:hidden}
.tbtn{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;width:20px;height:18px;font-size:11px;line-height:1;text-align:center;padding:0;font-family:inherit;cursor:default;color:#000}
.menu{display:flex;gap:2px;padding:2px 4px;font-size:12px}
.menu span{padding:2px 6px;cursor:default}
.body{padding:8px}
fieldset{border:2px groove #dfdfdf;margin:0 0 10px;padding:8px}
legend{padding:0 4px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.wbtn{background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:3px 16px;font-family:inherit;font-size:12px;cursor:pointer;color:#000}
.wbtn:active{border-color:#404040 #fff #fff #404040}
.wbtn:disabled{color:#808080;text-shadow:1px 1px 0 #fff;cursor:default}
select,input[type=text]{font-family:inherit;font-size:12px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:2px}
input[type=file]{font-family:inherit;font-size:12px}
.sunken{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px;min-height:64px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.sunken .part{color:#808080;font-style:italic}
.sunken .fin{color:#000}
.sunken .ph{color:#808080;font-style:italic}
.statusline{margin-top:6px;font-size:12px}
.meter{height:12px;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;margin-top:6px}
.meter>div{height:100%;width:0%;background:#000080}
.metrics{font-size:11px;margin-top:4px;font-family:monospace}
.log{font-size:11px;margin-top:4px;font-family:monospace;max-height:120px;overflow:auto}
.log div{white-space:pre-wrap;word-break:break-word}
footer{color:#fff;text-align:center;margin-top:12px;font-size:11px}
footer a{color:#fff}
</style>
<link rel="stylesheet" href="aero-theme.css">
</head>
<body>
<div class="win">
  <div class="titlebar"><span class="t">Nemotron ASR - Live Demo</span><span style="display:flex;gap:2px"><button class="tbtn" id="th95" title="Win95" style="width:auto;padding:0 6px">95</button><button class="tbtn" id="thGlass" title="Glass" style="width:auto;padding:0 6px">Glass</button></span><button class="tbtn" tabindex="-1">_</button><button class="tbtn" tabindex="-1">X</button></div>
  <div class="menu"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>H</u>elp</span></div>
  <div class="body">
    <fieldset>
      <legend>Live microphone (Nemotron stream)</legend>
      <div class="row">
        <button class="wbtn" id="startBtn" onclick="startMic()">Start</button>
        <button class="wbtn" id="stopBtn" onclick="stopMic()" disabled>Stop</button>
        <label>Language <select id="langMic">
          <option value="auto">Auto</option><option value="en">en</option><option value="hi">hi</option><option value="de">de</option><option value="fr">fr</option><option value="es">es</option>
        </select></label>
        <label>Chunk <select id="chunkMic">
          <option value="80">80</option><option value="160">160</option><option value="320">320</option><option value="560" selected>560</option><option value="1120">1120</option>
        </select></label>
      </div>
      <div class="row statusline">Status: <span id="micStatus">Ready</span></div>
      <div class="meter"><div id="levelFill"></div></div>
      <div class="sunken" id="micOut" style="margin-top:6px"><span class="ph">Click Start and speak...</span></div>
      <div class="metrics" id="micMetrics"></div>
      <details><summary>Event log</summary><div class="log" id="micLog"></div></details>
    </fieldset>
    <fieldset>
      <legend>File upload</legend>
      <div class="row">
        <input type="file" id="fileInput" accept="audio/*">
        <button class="wbtn" id="uploadBtn" onclick="uploadFile()" disabled>Transcribe</button>
        <label>Language <select id="langFile">
          <option value="auto">Auto</option><option value="en">en</option><option value="hi">hi</option><option value="de">de</option><option value="fr">fr</option><option value="es">es</option>
        </select></label>
      </div>
      <div class="row statusline">Status: <span id="fileStatus">Choose an audio file...</span></div>
      <div class="sunken" id="fileOut"><span class="ph">Result appears here.</span></div>
      <div class="metrics" id="fileMetrics"></div>
      <div class="row" style="margin-top:6px">
        <label style="flex:1;display:flex;gap:6px;align-items:center">Parakeet URL <input type="text" id="pqUrl" style="flex:1"></label>
        <button class="wbtn" id="pqBtn" onclick="uploadParakeet()" disabled>Parakeet</button>
      </div>
      <div class="sunken" id="pqOut" style="margin-top:6px"><span class="ph">Parakeet result appears here.</span></div>
      <div class="metrics" id="pqMetrics"></div>
    </fieldset>
  </div>
</div>
<footer>Classic demo &middot; <a href="/">modern UI</a></footer>
<script>
var TARGET=16000,FLUSH_MS=180;
var ws=null,audioCtx=null,workletNode=null,micStream=null;
var nativeRate=0,serverRate=TARGET;
var sendBuf=[],sendBufLen=0,flushTimer=null,lastFlush=0;
var finalWaiter=null,segCount=0,chunksSent=0,sendErr=0,t0=0,lvl=0;
var WORKLET='class P extends AudioWorkletProcessor{process(i){var c=i[0];if(c&&c[0]){var c2=new Float32Array(c[0].length);c2.set(c[0]);this.port.postMessage(c2,[c2.buffer]);}return true;}}registerProcessor("pcm",P);';
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function logEv(s){var d=document.createElement('div');d.textContent=s;micLog.appendChild(d);micLog.scrollTop=micLog.scrollHeight;}
function fmtM(m){if(!m||!m.duration_seconds)return'';var p=['duration: '+m.duration_seconds.toFixed(2)+'s'];if(m.wall_seconds)p.push('wall: '+m.wall_seconds.toFixed(2)+'s');if(m.rtf!=null)p.push('rtf: '+Number(m.rtf).toFixed(2));if(m.chunks_processed!=null)p.push('chunks: '+m.chunks_processed);return p.join('  ');}
function setMic(s){micStatus.textContent=s;}
function liveMetrics(){micMetrics.textContent='sent='+chunksSent+' err='+sendErr+' segs='+segCount;}
function levelTick(){if(!analyser)return;var b=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(b);var s=0,i;for(i=0;i<b.length;i++)s+=b[i];var t=(s/b.length/80)*100;lvl+=(Math.min(100,t)-lvl)*0.3;levelFill.style.width=lvl+'%';rafId=requestAnimationFrame(levelTick);}
function levelStart(ctx,src){analyser=ctx.createAnalyser();analyser.fftSize=256;src.connect(analyser);lvl=0;levelTick();}
function levelStop(){if(rafId)cancelAnimationFrame(rafId);rafId=null;analyser=null;lvl=0;levelFill.style.width='0%';}
function flushSend(force){if(!ws||ws.readyState!==WebSocket.OPEN||!sendBufLen)return;var now=performance.now();var want=Math.floor(serverRate*FLUSH_MS/1000);if(!force&&sendBufLen<want&&(now-lastFlush)<FLUSH_MS*2)return;var mg=new Float32Array(sendBufLen),o=0,i;for(i=0;i<sendBuf.length;i++){mg.set(sendBuf[i],o);o+=sendBuf[i].length;}sendBuf=[];sendBufLen=0;lastFlush=now;var p=downsample(mg,nativeRate,serverRate);if(!p.length)return;try{ws.send(p.buffer);chunksSent++;if(chunksSent===1||chunksSent%50===0)logEv('sent #'+chunksSent+' n='+p.length);liveMetrics();}catch(e){sendErr++;logEv('send err: '+e.message);liveMetrics();}}
async function startMic(){
  if(ws&&ws.readyState!==WebSocket.CLOSED){try{ws.close();}catch(e){}cleanupMic();}
  startBtn.disabled=true;stopBtn.disabled=false;finalWaiter=null;sendBuf=[];sendBufLen=0;segCount=0;chunksSent=0;sendErr=0;lvl=0;micLog.innerHTML='';
  micOut.innerHTML='<span class="ph">Connecting...</span>';micMetrics.textContent='';setMic('Requesting microphone...');
  try{micStream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});}
  catch(e){setMic('Mic denied: '+e.message);startBtn.disabled=false;stopBtn.disabled=true;return;}
  var url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/v1/transcriptions/stream';
  try{ws=new WebSocket(url);}catch(e){setMic('WS fail: '+e.message);logEv('ws create err: '+e.message);cleanupMic();return;}
  ws.binaryType='arraybuffer';
  ws.onopen=function(){setMic('Connected');t0=performance.now();lastFlush=t0;try{ws.send(JSON.stringify({language:document.getElementById('langMic').value,chunk_ms:parseInt(document.getElementById('chunkMic').value,10)}));}catch(e){setMic('Config send failed');logEv('config err: '+e.message);}};
  ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.event==='ready'){serverRate=m.sample_rate||TARGET;logEv('ready sr='+serverRate);startAudio();}
    else if(m.event==='partial'){if(m.cumulative!==undefined)micOut.innerHTML='<span class="part">'+esc(m.cumulative)+'</span>';}
    else if(m.event==='segment'){segCount++;logEv('segment #'+m.index+' '+m.text);liveMetrics();}
    else if(m.event==='final'){var wall=(performance.now()-t0)/1000;micOut.innerHTML='<span class="fin">'+esc(m.text)+'</span>';micMetrics.textContent=fmtM(m)+'  segs='+segCount+' sent='+chunksSent+' err='+sendErr+' wall='+wall.toFixed(2)+'s';setMic('Done');logEv('final len='+m.text.length);if(finalWaiter){finalWaiter(m);finalWaiter=null;}}
    else if(m.event==='error'){setMic('Error: '+m.message);logEv('error '+m.message);if(finalWaiter){finalWaiter(null);finalWaiter=null;}}
  };
  ws.onerror=function(){setMic('WebSocket error');logEv('ws error');if(finalWaiter){finalWaiter(null);finalWaiter=null;}cleanupMic();};
  ws.onclose=function(){if(flushTimer){clearInterval(flushTimer);flushTimer=null;}if(finalWaiter){finalWaiter(null);finalWaiter=null;}if(startBtn.disabled){setMic('Disconnected');logEv('close sent='+chunksSent+' err='+sendErr);cleanupMic();}};
}
async function startAudio(){
  try{
    audioCtx=new AudioContext();if(audioCtx.state==='suspended'){try{await audioCtx.resume();}catch(e){}if(audioCtx.state==='suspended')logEv('warn: AudioContext suspended');}
    nativeRate=audioCtx.sampleRate;setMic('Recording '+nativeRate+'Hz -> '+serverRate+'Hz');
    var src=audioCtx.createMediaStreamSource(micStream);levelStart(audioCtx,src);
    var blob=new Blob([WORKLET],{type:'application/javascript'});var u=URL.createObjectURL(blob);
    await audioCtx.audioWorklet.addModule(u);URL.revokeObjectURL(u);
    workletNode=new AudioWorkletNode(audioCtx,'pcm');
    workletNode.port.onmessage=function(e){if(!ws||ws.readyState!==WebSocket.OPEN)return;sendBuf.push(e.data);sendBufLen+=e.data.length;flushSend(false);};
    lastFlush=performance.now();flushTimer=setInterval(function(){flushSend(false);},FLUSH_MS);
    var mute=audioCtx.createGain();mute.gain.value=0;src.connect(workletNode);workletNode.connect(mute);mute.connect(audioCtx.destination);
  }catch(e){setMic('Audio failed: '+e.message);logEv('audio err: '+e.message);}
}
async function stopMic(){
  if(flushTimer){clearInterval(flushTimer);flushTimer=null;}
  if(ws&&ws.readyState===WebSocket.OPEN){
    flushSend(true);
    try{ws.send(JSON.stringify({event:'end'}));}catch(e){sendErr++;logEv('end err: '+e.message);}
    setMic('Finalizing...');
    try{await new Promise(function(res){finalWaiter=res;setTimeout(function(){if(finalWaiter){finalWaiter(null);finalWaiter=null;}},5000);});}
    finally{if(ws&&ws.readyState===WebSocket.OPEN)ws.close();}
  }
  cleanupMic();
}
window.addEventListener('beforeunload',function(){if(ws&&ws.readyState===WebSocket.OPEN){try{ws.send(JSON.stringify({event:'end'}));}catch(e){}}});
function cleanupMic(){if(flushTimer){clearInterval(flushTimer);flushTimer=null;}levelStop();if(workletNode){try{workletNode.disconnect();}catch(e){}workletNode=null;}if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}if(micStream){micStream.getTracks().forEach(function(t){t.stop();});micStream=null;}startBtn.disabled=false;stopBtn.disabled=true;}
(function(){var KEY='nm-theme';function apply(t){document.body.dataset.theme=(t==='glass')?'glass':'win95';try{localStorage.setItem(KEY,document.body.dataset.theme);}catch(e){}}var b95=document.getElementById('th95'),bG=document.getElementById('thGlass');if(b95)b95.onclick=function(){apply('win95');};if(bG)bG.onclick=function(){apply('glass');};var init='win95';try{init=localStorage.getItem(KEY)||'win95';}catch(e){}apply(init);})();
var fileInput=document.getElementById('fileInput'),uploadBtn=document.getElementById('uploadBtn');
var fileOut=document.getElementById('fileOut'),fileStatus=document.getElementById('fileStatus'),fileMetrics=document.getElementById('fileMetrics');
var pqBtn=document.getElementById('pqBtn'),pqUrl=document.getElementById('pqUrl'),pqOut=document.getElementById('pqOut'),pqMetrics=document.getElementById('pqMetrics');
pqUrl.value=location.protocol+'//'+location.hostname+':3005/transcribe';
fileInput.addEventListener('change',function(){var f=fileInput.files[0];if(f){uploadBtn.disabled=false;pqBtn.disabled=false;fileStatus.textContent=f.name+' ('+(f.size/1024).toFixed(0)+' KB)';}else{uploadBtn.disabled=true;pqBtn.disabled=true;fileStatus.textContent='Choose an audio file...';}});
async function uploadFile(){
  var f=fileInput.files[0];if(!f)return;uploadBtn.disabled=true;
  fileOut.innerHTML='<span class="ph">Transcribing...</span>';fileMetrics.textContent='';fileStatus.textContent='Uploading '+f.name+'...';
  var fd=new FormData();fd.append('file',f);fd.append('language',document.getElementById('langFile').value);
  try{var r=await fetch('/v1/transcriptions',{method:'POST',body:fd});var d=await r.json();
    if(r.ok){fileOut.innerHTML='<span class="fin">'+esc(d.text)+'</span>';fileStatus.textContent='Done';fileMetrics.textContent=fmtM(d);}
    else{fileOut.innerHTML='<span class="ph">Error: '+esc(d.detail||'Unknown')+'</span>';fileStatus.textContent='Error';}
  }catch(e){fileOut.innerHTML='<span class="ph">Fetch error: '+esc(e.message)+'</span>';fileStatus.textContent='Error';}
  uploadBtn.disabled=false;
}
async function uploadParakeet(){
  var f=fileInput.files[0];if(!f)return;pqBtn.disabled=true;
  pqOut.innerHTML='<span class="ph">Transcribing...</span>';pqMetrics.textContent='';
  var t0p=performance.now();var fd=new FormData();fd.append('file',f);fd.append('language',document.getElementById('langFile').value);
  try{var r=await fetch(pqUrl.value,{method:'POST',body:fd});var d=await r.json();
    var wall=(performance.now()-t0p)/1000;
    if(r.ok){pqOut.innerHTML='<span class="fin">'+esc(d.text)+'</span>';pqMetrics.textContent='wall='+wall.toFixed(2)+'s'+(d.language?' lang='+d.language:'');}
    else{pqOut.innerHTML='<span class="ph">Error: '+esc(d.detail||JSON.stringify(d))+'</span>';}
  }catch(e){pqOut.innerHTML='<span class="ph">Fetch error: '+esc(e.message)+'</span>';}
  pqBtn.disabled=false;
}
</script>
</body>
</html>
