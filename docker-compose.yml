services:
  nemotron-asr:
    container_name: nemotron-asr
    image: nemotron-asr:cpu
    build: .
    ports:
      - "${HOST_PORT:-3003}:8000"
      - "${HTTPS_PORT:-3004}:8443"
    environment:
      MODEL_ID: onnx-community/nemotron-3.5-asr-streaming-0.6b-onnx-int4
      MODEL_DIR: /models/nemotron
      EXECUTION_PROVIDER: cpu
      CONFIG_PATH: /app/config.yaml
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
    volumes:
      - ./nemotron-models:/models
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 512M
  parakeet-asr:
    container_name: parakeet-asr
    image: parakeet-asr:cpu
    build: ./parakeet
    ports:
      - "${PARAKEET_PORT:-3005}:8000"
    volumes:
      - ./parakeet-models:/app/models
    environment:
      OMP_NUM_THREADS: "4"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
